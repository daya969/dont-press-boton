<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحذرتك لا تضغط على الزر مدري يمكن فعلت بازوكا او خليت ديفيد خازوقا يسوي تحديثات ازبل بسبب الضغط</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { font-size: 2.2rem; color: #ff4757; }
    .btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
    }
    .btn:active { transform: scale(0.95); }
    .msg-box {
      margin-top: 30px;
      background: #2ed573;
      color: #000;
      padding: 18px 36px;
      border-radius: 15px;
      font-size: 1.8rem;
      font-weight: bold;
      display: none;
      box-shadow: 0 8px 25px rgba(46, 213, 115, 0.4);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>🚫 لا تضغط على الزر!</h1>
  <button class="btn" id="clickBtn" onclick="registerClick()">اضغط هنا</button>

  <div id="msgBox" class="msg-box">
    مبروك أنت ملقوف 🥳
  </div>

  <script>
    const SUPABASE_URL = "https://tnjcafzqrirlaaxropsw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RnRzCqjzYowBpCdRBx8QRQ_rezG5DKG";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function registerClick() {
      document.getElementById("msgBox").style.display = "block";
      document.getElementById("clickBtn").disabled = true;
      
      // تسديد الضغطة بالخلفية بدون أي تحويل أو نقل
      await _supabase.from("clicks").insert([{}]);
    }
  </script>

</body>
</html>
