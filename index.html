<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لا تضغط الزر</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ff4757; }
    .btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    .result-box {
      margin-top: 30px;
      font-size: 1.8rem;
      background: #2ed573;
      padding: 15px 30px;
      border-radius: 12px;
      display: none; /* مخفية حتى يضغط الزر */
    }
    .count { font-weight: bold; font-size: 2.2rem; color: #000; }
  </style>
</head>
<body>

  <h1>🚫 لا تضغط على الزر!</h1>
  <button class="btn" onclick="registerClick()">اضغط هنا</button>

  <div id="resultBox" class="result-box">
    عدد الملقوفين قبلك: <span id="counter" class="count">...</span> شخص 🥳
  </div>

  <script>
    // اسم مفتاح العداد الخاص بك (اختر أي اسم فريد)
    const namespace = "my_curiosity_challenge_2026";
    const key = "la_tadghat_btn";

    async function registerClick() {
      // 1. إرسال طلب API مجاني لزيادة العداد +1 وجلب النتيجة
      try {
        const response = await fetch(`https://hook.eu1.make.com/pqj1t8shf8p5kmof5j10uncr3rl6jvdv/${namespace}/${key}`);
        const data = await response.json();

        // 2. عرض عدد الملقوفين في الشاشة
        document.getElementById("counter").innerText = data.value;
        document.getElementById("resultBox").style.display = "block";
      } catch (error) {
        console.error("خطأ في جلب العداد:", error);
      }
    }
  </script>

</body>
</html>
