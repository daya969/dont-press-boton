<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لا تضغط على الزر</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { font-size: 2.2rem; color: #ff4757; }
    .btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
    }
    .btn:active { transform: scale(0.95); }
    .result-box {
      margin-top: 30px;
      font-size: 1.5rem;
      background: #2ed573;
      color: #000;
      padding: 15px 30px;
      border-radius: 12px;
      display: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🚫 لا تضغط على الزر!</h1>
  <button class="btn" onclick="registerClick()">اضغط هنا</button>

  <div id="resultBox" class="result-box">
    عدد الملقوفين: <span id="counter">1</span> شخص 🥳
  </div>

  <script>
    const webhookUrl = "https://hook.eu1.make.com/pqj1t8shf8p5kmof5j10uncr3rl6jvdv";

    function registerClick() {
      // 1. زيادة العداد على الشاشة فورا
      const resultBox = document.getElementById("resultBox");
      const counterText = document.getElementById("counter");

      let currentCount = parseInt(localStorage.getItem("malgouf_count") || "0") + 1;
      localStorage.setItem("malgouf_count", currentCount);
      
      counterText.innerText = currentCount;
      resultBox.style.display = "block";

      // 2. إرسال الطلب لـ Make.com بآلية تضمن العبور (no-cors)
      fetch(webhookUrl + "?event=malgouf_click&count=" + currentCount, {
        method: "GET",
        mode: "no-cors"
      }).then(() => {
        console.log("تم الإرسال لـ Make بنجاح!");
      }).catch(err => {
        console.error("خطأ:", err);
      });
    }
  </script>

</body>
</html>
